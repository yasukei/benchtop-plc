name: Runtime benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to compare with the pre-resumable baseline (branch, tag or SHA)
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Check out the pre-resumable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f0cd173a3a75f89e241780fd24e886f7388998c2
          path: baseline
          persist-credentials: false
      - name: Check out the chosen revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: harness/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: harness/.node-version
          package-manager-cache: false
      - name: Measure both revisions sequentially
        run: node harness/scripts/runtime-benchmark.ts baseline candidate results
      - name: Publish comparison
        if: ${{ !cancelled() && hashFiles('results/summary.md') != '' }}
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements and environment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-benchmark
          path: results/
          retention-days: 30
          if-no-files-found: error
