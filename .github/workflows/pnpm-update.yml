name: Update pnpm

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pnpm-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Select the latest pnpm published at least seven days ago
        id: version
        run: node scripts/pnpm-update.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.version.outputs.changed == 'true'
      - name: Regenerate and verify the lockfile with the selected pnpm
        if: steps.version.outputs.changed == 'true'
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.version.outputs.changed == 'true'
        id: app-token
        with:
          app-id: ${{ vars.PNPM_BUMP_APP_ID }}
          private-key: ${{ secrets.PNPM_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.version.outputs.changed == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch-token: ${{ steps.app-token.outputs.token }}
          branch: pnpm-update
          add-paths: |
            package.json
            pnpm-lock.yaml
          commit-message: "chore(deps): bump pnpm from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.latest }}"
          title: "chore(deps): bump pnpm from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.latest }}"
          body: |
            Bumps pnpm from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.latest }}
            and regenerates `pnpm-lock.yaml` with that exact version.

            The release was published to npm at least seven days before this run.
            Review breaking changes before merging a major version update.
          labels: dependencies
